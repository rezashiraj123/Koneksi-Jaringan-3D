<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi 3D Koneksi Internet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .ui-overlay {
            position: absolute;
            pointer-events: none; /* Let clicks pass through to the 3D canvas by default */
        }
        .interactive {
            pointer-events: auto; /* Enable clicks for buttons/panels */
        }
    </style>
</head>
<body class="text-slate-100">

    <!-- Container for Three.js Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div class="ui-overlay top-0 left-0 w-full h-full flex flex-col justify-between p-4 sm:p-8">
        
        <!-- Header -->
        <div class="interactive flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="bg-slate-800/80 backdrop-blur-md p-4 rounded-2xl border border-slate-600 shadow-xl max-w-md">
                <h1 class="text-2xl font-bold text-white mb-2">Jaringan & Konektivitas 📶</h1>
                <p class="text-sm text-slate-300">
                    Pilih mode di bawah ini untuk melihat simulasi 3D bagaimana perangkat saling terhubung untuk mendapatkan akses internet.
                </p>
                <div class="text-xs text-slate-400 mt-2 flex items-center">
                    <span class="mr-2">💡</span>
                    <span>Tahan klik & geser untuk memutar kamera. Scroll untuk zoom.</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex flex-col gap-3 bg-slate-800/80 backdrop-blur-md p-3 rounded-2xl border border-slate-600 shadow-xl w-full md:w-auto">
                <div class="flex flex-col gap-2">
                    <span class="text-xs text-slate-400 font-semibold uppercase text-center md:text-left">Mode Koneksi Dasar</span>
                    <div class="flex flex-row gap-2 justify-center md:justify-start">
                        <button id="btn-wifi" class="interactive px-3 py-2 bg-blue-600 hover:bg-blue-500 transition-colors rounded-xl font-semibold text-white shadow-lg shadow-blue-500/30 flex items-center gap-1 text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path></svg>
                            Wi-Fi
                        </button>
                        <button id="btn-tethering" class="interactive px-3 py-2 bg-orange-600 hover:bg-orange-500 transition-colors rounded-xl font-semibold text-white shadow-lg shadow-orange-500/30 flex items-center gap-1 text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                            Tethering
                        </button>
                    </div>
                </div>
                <div class="h-px bg-slate-600 w-full"></div>
                <div class="flex flex-col gap-2">
                    <span class="text-xs text-slate-400 font-semibold uppercase text-center md:text-left">Cakupan Jaringan</span>
                    <div class="flex flex-row gap-2 justify-center md:justify-start flex-wrap">
                        <button id="btn-pan" class="interactive px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 transition-colors rounded-lg font-semibold text-white shadow shadow-emerald-500/30 text-sm">PAN</button>
                        <button id="btn-lan" class="interactive px-3 py-1.5 bg-amber-600 hover:bg-amber-500 transition-colors rounded-lg font-semibold text-white shadow shadow-amber-500/30 text-sm">LAN</button>
                        <button id="btn-man" class="interactive px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 transition-colors rounded-lg font-semibold text-white shadow shadow-cyan-500/30 text-sm">MAN</button>
                        <button id="btn-wan" class="interactive px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 transition-colors rounded-lg font-semibold text-white shadow shadow-indigo-500/30 text-sm">WAN</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Info Panel (Bottom) -->
        <div class="flex justify-center mb-4">
            <div id="info-panel" class="interactive bg-slate-800/90 backdrop-blur-md p-5 rounded-2xl border border-slate-600 shadow-2xl max-w-2xl w-full transform transition-all duration-500 opacity-0 translate-y-4">
                <h2 id="info-title" class="text-xl font-bold text-white mb-3 flex items-center gap-2">
                    <!-- Title injected here -->
                </h2>
                <ul id="info-steps" class="space-y-2 text-slate-300 text-sm md:text-base list-disc list-inside">
                    <!-- Steps injected here -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Three.js Library & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        window.onload = function () {
            // --- Scene Setup ---
            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#0f172a');
            scene.fog = new THREE.FogExp2('#0f172a', 0.03);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 8, 12);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1; // Limit panning below ground

            // --- Lighting ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            // --- Environment (Grid & Floor) ---
            const gridHelper = new THREE.GridHelper(40, 40, 0x334155, 0x1e293b);
            gridHelper.position.y = -0.5;
            scene.add(gridHelper);

            // --- 3D Objects Factory ---
            
            // 1. Smartphone Model
            function createPhone(color) {
                const group = new THREE.Group();
                
                // Body
                const bodyGeo = new THREE.BoxGeometry(1.2, 0.15, 2.4);
                const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.8 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.castShadow = true;
                group.add(body);

                // Screen
                const screenGeo = new THREE.BoxGeometry(1.1, 0.16, 2.2);
                const screenMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9 });
                const screen = new THREE.Mesh(screenGeo, screenMat);
                screen.position.y = 0.02;
                group.add(screen);

                return group;
            }

            // 2. Wi-Fi Router Model
            function createRouter() {
                const group = new THREE.Group();
                
                // Base
                const baseGeo = new THREE.BoxGeometry(2.5, 0.4, 1.8);
                const baseMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.5 });
                const base = new THREE.Mesh(baseGeo, baseMat);
                base.castShadow = true;
                group.add(base);

                // Antennas
                const antennaGeo = new THREE.CylinderGeometry(0.04, 0.06, 1.5);
                const antennaMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
                
                const ant1 = new THREE.Mesh(antennaGeo, antennaMat);
                ant1.position.set(-0.8, 0.8, -0.6);
                ant1.rotation.x = -0.2;
                group.add(ant1);

                const ant2 = new THREE.Mesh(antennaGeo, antennaMat);
                ant2.position.set(0.8, 0.8, -0.6);
                ant2.rotation.x = -0.2;
                group.add(ant2);

                // Lights indicator
                const lightGeo = new THREE.BoxGeometry(0.8, 0.41, 0.1);
                const lightMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6 }); // Blue active light
                const light = new THREE.Mesh(lightGeo, lightMat);
                light.position.set(0, 0, 0.88);
                group.add(light);

                return group;
            }

            // 3. Laptop Model (PAN)
            function createLaptop() {
                const group = new THREE.Group();
                const base = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1.5), new THREE.MeshStandardMaterial({color: 0x94a3b8}));
                base.castShadow = true;
                const screen = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 0.1), new THREE.MeshStandardMaterial({color: 0x111111}));
                screen.position.set(0, 0.6, -0.7);
                screen.castShadow = true;
                group.add(base, screen);
                return group;
            }

            // 4. PC Model (LAN)
            function createPC() {
                const group = new THREE.Group();
                const monitor = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 0.1), new THREE.MeshStandardMaterial({color: 0x1e293b}));
                monitor.position.y = 0.8;
                const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.2, 0.5), new THREE.MeshStandardMaterial({color: 0x64748b}));
                stand.position.y = 0.25;
                const cpu = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 1.5), new THREE.MeshStandardMaterial({color: 0x0f172a}));
                cpu.position.set(1.2, 0.6, 0);
                group.add(monitor, stand, cpu);
                return group;
            }

            // 5. Building Model (MAN)
            function createBuilding(height, color) {
                const group = new THREE.Group();
                const b = new THREE.Mesh(new THREE.BoxGeometry(2, height, 2), new THREE.MeshStandardMaterial({color: color, roughness: 0.8}));
                b.position.y = height / 2;
                b.castShadow = true;
                group.add(b);
                return group;
            }

            // 6. Globe Model (WAN)
            function createGlobe() {
                const group = new THREE.Group();
                const earthGeo = new THREE.SphereGeometry(3, 32, 32);
                const earthMat = new THREE.MeshStandardMaterial({color: 0x0284c7, wireframe: true, transparent: true, opacity: 0.8});
                const earth = new THREE.Mesh(earthGeo, earthMat);
                earth.position.y = 3;
                group.add(earth);
                return group;
            }

            // --- Instantiate Objects ---
            
            // Router (Left)
            const router = createRouter();
            router.position.set(-4, 0, -2);
            scene.add(router);

            // Hotspot Phone (Right)
            const hotspotPhone = createPhone(0xf97316); // Orange casing
            hotspotPhone.position.set(4, 0, -2);
            scene.add(hotspotPhone);

            // Main User Phone (Center, Moving)
            const mainPhone = createPhone(0x3b82f6); // Blue casing
            mainPhone.position.set(0, 0, 4);
            scene.add(mainPhone);

            // Labels using simple Sprites (Canvas based text)
            function createTextSprite(message) {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 512;
                canvas.height = 128;
                context.font = "Bold 40px Arial";
                context.fillStyle = "rgba(255,255,255,1)";
                context.textAlign = "center";
                context.fillText(message, 256, 80);
                
                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(spriteMaterial);
                sprite.scale.set(4, 1, 1);
                return sprite;
            }

            const routerLabel = createTextSprite("Router Wi-Fi");
            routerLabel.position.set(-4, 2.5, -2);
            scene.add(routerLabel);

            const hotspotLabel = createTextSprite("HP 1 (Tethering)");
            hotspotLabel.position.set(4, 1.5, -2);
            scene.add(hotspotLabel);

            const mainLabel = createTextSprite("Perangkat Kita");
            mainLabel.position.set(0, 1.5, 4);
            mainPhone.add(mainLabel); // Attach to moving phone

            // --- New Network Coverage Groups ---
            let earthModel, satelliteModel; // For WAN animation

            const groupPAN = new THREE.Group();
            const panLaptop = createLaptop();
            panLaptop.position.set(-1.5, 0, 0);
            const panPhone = createPhone(0x10b981); // Emerald
            panPhone.position.set(1.5, 0, 0.5);
            const panWatch = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.1, 0.2), new THREE.MeshStandardMaterial({color: 0xef4444}));
            panWatch.position.set(2.5, 0.05, -0.5);
            groupPAN.add(panLaptop, panPhone, panWatch);
            
            const panLineMat = new THREE.LineDashedMaterial({ color: 0x10b981, dashSize: 0.2, gapSize: 0.1 });
            const panGeom1 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1.5,0.2,0), new THREE.Vector3(1.5,0.2,0.5)]);
            const panLine1 = new THREE.Line(panGeom1, panLineMat); panLine1.computeLineDistances();
            const panGeom2 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(1.5,0.2,0.5), new THREE.Vector3(2.5,0.1,-0.5)]);
            const panLine2 = new THREE.Line(panGeom2, panLineMat); panLine2.computeLineDistances();
            groupPAN.add(panLine1, panLine2);
            groupPAN.visible = false;
            scene.add(groupPAN);

            const groupLAN = new THREE.Group();
            const lanSwitch = createRouter(); 
            lanSwitch.position.set(0, 0, 0);
            groupLAN.add(lanSwitch);
            const pcPos = [[-3,0,-3], [3,0,-3], [-3,0,3], [3,0,3]];
            pcPos.forEach(p => {
                const pc = createPC();
                pc.position.set(...p);
                pc.lookAt(0,0,0);
                groupLAN.add(pc);
                const cableGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0.1,0), new THREE.Vector3(p[0],0.1,p[2])]);
                const cable = new THREE.Line(cableGeom, new THREE.LineBasicMaterial({color: 0xf59e0b}));
                groupLAN.add(cable);
            });
            groupLAN.visible = false;
            scene.add(groupLAN);

            const groupMAN = new THREE.Group();
            const b1 = createBuilding(3, 0x3b82f6); b1.position.set(-4, 0, -2);
            const b2 = createBuilding(5, 0x8b5cf6); b2.position.set(4, 0, -4);
            const b3 = createBuilding(4, 0x10b981); b3.position.set(0, 0, 4);
            groupMAN.add(b1, b2, b3);
            const manLineMat = new THREE.LineBasicMaterial({color: 0x06b6d4});
            groupMAN.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-4,0,-2), new THREE.Vector3(4,0,-4)]), manLineMat));
            groupMAN.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(4,0,-4), new THREE.Vector3(0,0,4)]), manLineMat));
            groupMAN.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,4), new THREE.Vector3(-4,0,-2)]), manLineMat));
            groupMAN.visible = false;
            scene.add(groupMAN);

            const groupWAN = new THREE.Group();
            const globeGroup = createGlobe();
            earthModel = globeGroup.children[0];
            groupWAN.add(globeGroup);
            
            satelliteModel = new THREE.Group();
            const satBody = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6), new THREE.MeshStandardMaterial({color:0x94a3b8}));
            const satPanel1 = new THREE.Mesh(new THREE.BoxGeometry(2,0.1,0.6), new THREE.MeshStandardMaterial({color:0x1d4ed8}));
            satPanel1.position.x = -1.3;
            const satPanel2 = new THREE.Mesh(new THREE.BoxGeometry(2,0.1,0.6), new THREE.MeshStandardMaterial({color:0x1d4ed8}));
            satPanel2.position.x = 1.3;
            satelliteModel.add(satBody, satPanel1, satPanel2);
            satelliteModel.position.set(5, 4, 0);
            groupWAN.add(satelliteModel);
            groupWAN.visible = false;
            scene.add(groupWAN);

            // --- Connectivity Visuals (Signals & Lines) ---
            
            const waves = [];
            
            // Function to spawn a signal wave
            function spawnWave(sourcePos, colorHex) {
                const waveGeo = new THREE.TorusGeometry(0.5, 0.03, 16, 64);
                const waveMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 1, side: THREE.DoubleSide });
                const wave = new THREE.Mesh(waveGeo, waveMat);
                wave.position.copy(sourcePos);
                wave.rotation.x = Math.PI / 2; // Lay flat
                scene.add(wave);
                waves.push(wave);
            }

            // Connection Line
            const lineMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.2, gapSize: 0.1, opacity: 0, transparent: true });
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
            const connectionLine = new THREE.Line(lineGeo, lineMat);
            scene.add(connectionLine);


            // --- State Management ---
            let currentState = 'idle'; // 'idle', 'wifi', 'tethering'
            let mainPhoneTargetPos = new THREE.Vector3(0, 0, 4);
            let waveTimer = 0;

            const uiInfoPanel = document.getElementById('info-panel');
            const uiInfoTitle = document.getElementById('info-title');
            const uiInfoSteps = document.getElementById('info-steps');

            function resetVisibility() {
                // Hide default internet connection objects
                router.visible = false;
                hotspotPhone.visible = false;
                mainPhone.visible = false;
                connectionLine.visible = false;
                routerLabel.visible = false;
                hotspotLabel.visible = false;
                
                // Hide specific coverage groups
                groupPAN.visible = false;
                groupLAN.visible = false;
                groupMAN.visible = false;
                groupWAN.visible = false;
                
                // Clear any active wave animations
                waves.forEach(w => scene.remove(w));
                waves.length = 0;
            }

            function updateUI(title, colorClass, icon, steps) {
                uiInfoPanel.classList.remove('opacity-0', 'translate-y-4');
                uiInfoTitle.className = `text-xl font-bold ${colorClass} mb-3 flex items-center gap-2`;
                uiInfoTitle.innerHTML = `${icon} ${title}`;
                
                uiInfoSteps.innerHTML = '';
                steps.forEach(step => {
                    const li = document.createElement('li');
                    li.textContent = step;
                    uiInfoSteps.appendChild(li);
                });
            }

            document.getElementById('btn-wifi').addEventListener('click', () => {
                currentState = 'wifi';
                mainPhoneTargetPos.set(-2.5, 0, 0); // Move near router
                
                resetVisibility();
                router.visible = true;
                hotspotPhone.visible = true;
                mainPhone.visible = true;
                connectionLine.visible = true;
                routerLabel.visible = true;
                hotspotLabel.visible = true;
                
                updateUI('Koneksi Melalui Wi-Fi Router', 'text-blue-400', '🌐', [
                    'Sinyal Internet berasal dari kabel fiber optik ISP yang masuk ke Modem/Router.',
                    'Router memancarkan gelombang radio (Wi-Fi) secara nirkabel.',
                    'Kita mengaktifkan Wi-Fi di Perangkat, lalu memilih nama jaringan (SSID) milik Router.',
                    'Setelah memasukkan kata sandi, perangkat dan router membentuk jalur data terenkripsi.',
                    'Perangkat kini dapat mengakses internet global!'
                ]);
            });

            document.getElementById('btn-tethering').addEventListener('click', () => {
                currentState = 'tethering';
                mainPhoneTargetPos.set(2.5, 0, 0); // Move near hotspot phone
                
                resetVisibility();
                router.visible = true;
                hotspotPhone.visible = true;
                mainPhone.visible = true;
                connectionLine.visible = true;
                routerLabel.visible = true;
                hotspotLabel.visible = true;

                updateUI('Koneksi Melalui Tethering/Hotspot', 'text-orange-400', '📱', [
                    'HP 1 (Kanan) memiliki paket data seluler aktif dari Provider.',
                    'HP 1 mengaktifkan fitur "Personal Hotspot", mengubah fungsinya menjadi sebuah mini-router.',
                    'HP 1 memancarkan sinyal Wi-Fi buatannya sendiri.',
                    'Perangkat kita (Tengah) mencari jaringan Wi-Fi dan terhubung ke Hotspot HP 1.',
                    'Kini perangkat kita "menumpang" koneksi internet seluler milik HP 1.'
                ]);
            });

            document.getElementById('btn-pan').addEventListener('click', () => {
                currentState = 'pan';
                resetVisibility();
                groupPAN.visible = true;
                updateUI('PAN (Personal Area Network)', 'text-emerald-400', '⌚', [
                    'Jaringan personal, jangkauan sangat dekat (1-10 meter).',
                    'Contoh: Smartphone terhubung ke Smartwatch atau Laptop via Bluetooth.',
                    'Digunakan untuk sinkronisasi data pribadi antar perangkat pengguna secara lokal.'
                ]);
            });

            document.getElementById('btn-lan').addEventListener('click', () => {
                currentState = 'lan';
                resetVisibility();
                groupLAN.visible = true;
                updateUI('LAN (Local Area Network)', 'text-amber-400', '🏢', [
                    'Jaringan area lokal, mencakup satu ruangan, rumah, atau gedung kantor.',
                    'Semua perangkat (PC/Monitor) terhubung ke sebuah Switch/Router sentral.',
                    'Cepat, aman, dan dirancang untuk berbagi sumber daya seperti printer atau file antar komputer.'
                ]);
            });

            document.getElementById('btn-man').addEventListener('click', () => {
                currentState = 'man';
                resetVisibility();
                groupMAN.visible = true;
                updateUI('MAN (Metropolitan Area Network)', 'text-cyan-400', '🏙️', [
                    'Jaringan tingkat kota, menghubungkan beberapa LAN di berbagai gedung dalam radius luas.',
                    'Sering digunakan oleh korporasi atau institusi dengan banyak cabang di satu kota.',
                    'Biasa menggunakan jaringan fiber optik khusus berkecepatan tinggi.'
                ]);
            });

            document.getElementById('btn-wan').addEventListener('click', () => {
                currentState = 'wan';
                resetVisibility();
                groupWAN.visible = true;
                updateUI('WAN (Wide Area Network)', 'text-indigo-400', '🌍', [
                    'Jaringan terluas (skala global) yang menghubungkan wilayah, negara, hingga benua.',
                    'Internet yang kita gunakan sehari-hari adalah contoh WAN yang paling besar.',
                    'Menggunakan satelit, kabel laut raksasa, dan infrastruktur telekomunikasi lintas negara.'
                ]);
            });

            // --- Animation Loop ---
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();

                // 1. Move Main Phone towards target smoothly (Lerp)
                mainPhone.position.lerp(mainPhoneTargetPos, 0.05);

                // 2. Logic for specific states
                if (currentState === 'wifi') {
                    // Spawn waves from router
                    waveTimer += delta;
                    if (waveTimer > 0.8) {
                        spawnWave(new THREE.Vector3(-4, 0.5, -2), 0x3b82f6);
                        waveTimer = 0;
                    }
                    // Update connection line
                    const dist = mainPhone.position.distanceTo(new THREE.Vector3(-4, 0, -2));
                    if (dist < 4) {
                        connectionLine.material.opacity = 1;
                        connectionLine.material.color.setHex(0x3b82f6); // blue
                        const points = [
                            new THREE.Vector3(-4, 0.5, -2), // Router
                            mainPhone.position.clone().add(new THREE.Vector3(0, 0.2, 0)) // Main Phone
                        ];
                        connectionLine.geometry.setFromPoints(points);
                        connectionLine.computeLineDistances();
                    } else {
                        connectionLine.material.opacity = 0;
                    }
                } else if (currentState === 'pan') {
                    // Spawn waves representing Bluetooth/Local Sync
                    waveTimer += delta;
                    if (waveTimer > 0.6) {
                        spawnWave(new THREE.Vector3(1.5, 0.2, 0.5), 0x10b981);
                        waveTimer = 0;
                    }
                } else if (currentState === 'lan') {
                    // Waves from the central LAN switch
                    waveTimer += delta;
                    if (waveTimer > 0.8) {
                        spawnWave(new THREE.Vector3(0, 0.5, 0), 0xf59e0b);
                        waveTimer = 0;
                    }
                } else if (currentState === 'wan') {
                    // Animate Earth Rotation & Satellite Orbiting
                    if (earthModel) earthModel.rotation.y += 0.2 * delta;
                    if (satelliteModel) {
                        const time = clock.getElapsedTime();
                        satelliteModel.position.x = Math.cos(time * 0.5) * 6;
                        satelliteModel.position.z = Math.sin(time * 0.5) * 6;
                        satelliteModel.lookAt(0, 3, 0); // Always point solar panels to earth
                    }
                }

                // 3. Animate all active waves
                for (let i = waves.length - 1; i >= 0; i--) {
                    const w = waves[i];
                    w.scale.addScalar(4 * delta);
                    w.material.opacity -= 0.6 * delta;

                    if (w.material.opacity <= 0) {
                        scene.remove(w);
                        waves.splice(i, 1);
                    }
                }

                controls.update();
                renderer.render(scene, camera);
            }

            // Start loop
            animate();

            // Handle Window Resize
            window.addEventListener('resize', onWindowResize, false);
            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        };
    </script>
</body>
</html>
